<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ColorTrace</title><link rel="stylesheet" href="./style.css"></head><body><main>
<header class="masthead">
  <div class="masthead-copy">
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Local-only color evidence</p>
    <h1>ColorTrace</h1>
    <p class="lede">Every captured color, with its provenance. Nothing leaves this browser.</p>
  </div>
  <div class="actions">
    <input id="import-trace" class="visually-hidden-input" type="file" accept=".colortrace,application/json">
    <label for="import-trace" class="button-like">Import .colortrace</label>
    <button id="clear" type="button">Clear local history</button>
  </div>
</header>
<p id="status" role="status"></p>
<section id="traces" aria-label="Saved traces"></section>
<footer class="colophon"><p>ColorTrace keeps no screenshots, no page source, no cookies. Page identity is reduced to origin.</p></footer>
</main><script type="module" src="./main.ts"></script></body></html>
