<path d="M 247 275 L 267 275" stroke="#33ff66" stroke-width="2"/><path d="M 267 275 l -12 -6 l 2 12 z" fill="#33ff66"/><path d="M 486 275 L 506 275" stroke="#33ff66" stroke-width="2"/><path d="M 506 275 l -12 -6 l 2 12 z" fill="#33ff66"/><path d="M 725 275 L 745 275" stroke="#33ff66" stroke-width="2"/><path d="M 745 275 l -12 -6 l 2 12 z" fill="#33ff66"/>
<rect x="36" y="452" width="928" height="104" rx="10" fill="#0a100c" stroke="#1d3a26" stroke-width="1.2"/>
<text x="56" y="482" fill="#ffb020" font-size="12.5" font-weight="bold">privacy contract</text>
<text x="56" y="506" fill="#8fa89a" font-size="11.5">declares only activeTab + scripting · no screenshots · no cloud transport · no cookie access · page identity reduced to origin</text>
<text x="56" y="530" fill="#8fa89a" font-size="11.5">resolved computed style is labeled honestly — never presented as rendered-pixel appearance</text>
<text x="36" y="596" fill="#4a5f52" font-size="11.5">known limits by design: no rendered-pixel sampling, no invented cross-space deltas, no causal claims</text>
</svg>