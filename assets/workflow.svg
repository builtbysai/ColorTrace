<text x="305" y="185" text-anchor="middle" fill="#33ff66" font-size="13" font-weight="bold">2</text>
<text x="327" y="185" fill="#e8f5ec" font-size="13.5" font-weight="bold">FIREWALL + STORE</text>
<text x="293.0" y="278" fill="#8fa89a" font-size="10.8">evidence firewall,</text><text x="293.0" y="294" fill="#8fa89a" font-size="10.8">strict schema</text><text x="293.0" y="310" fill="#8fa89a" font-size="10.8">validation,</text><text x="293.0" y="326" fill="#8fa89a" font-size="10.8">stored only in</text><text x="293.0" y="342" fill="#8fa89a" font-size="10.8">extension-origin</text><text x="293.0" y="358" fill="#8fa89a" font-size="10.8">IndexedDB</text>

</g>
<g>
<rect x="514" y="150" width="211" height="250" rx="12" fill="#0a100c" stroke="#1d3a26" stroke-width="1.5"/>
<circle cx="544" cy="180" r="13" fill="none" stroke="#33ff66" stroke-width="1.6"/>
