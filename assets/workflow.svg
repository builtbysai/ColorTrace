<text x="88" y="185" fill="#e8f5ec" font-size="13.5" font-weight="bold">CAPTURE</text>
<text x="54.0" y="278" fill="#8fa89a" font-size="10.8">Alt+Shift+C or toolbar</text><text x="54.0" y="294" fill="#8fa89a" font-size="10.8">action</text><text x="54.0" y="310" fill="#8fa89a" font-size="10.8">picker: hover + click,</text><text x="54.0" y="326" fill="#8fa89a" font-size="10.8">or Tab through + Enter</text><text x="54.0" y="342" fill="#8fa89a" font-size="10.8">Escape cancels</text>
