<text x="771.0" y="278" fill="#8fa89a" font-size="10.8">export / import</text><text x="771.0" y="294" fill="#8fa89a" font-size="10.8">.colortrace</text><text x="771.0" y="310" fill="#8fa89a" font-size="10.8">(validated, deduped),</text><text x="771.0" y="326" fill="#8fa89a" font-size="10.8">regression report omits:</text><text x="771.0" y="342" fill="#8fa89a" font-size="10.8">screenshots, URLs,</text><text x="771.0" y="358" fill="#8fa89a" font-size="10.8">selectors, causal claims</text>

