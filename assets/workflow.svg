<text x="566" y="185" fill="#e8f5ec" font-size="13.5" font-weight="bold">COMPARE</text>
<text x="532.0" y="278" fill="#8fa89a" font-size="10.8">baseline vs candidate:</text><text x="532.0" y="294" fill="#8fa89a" font-size="10.8">appearance coordinates,</text><text x="532.0" y="310" fill="#8fa89a" font-size="10.8">property / state / env,</text><text x="532.0" y="326" fill="#8fa89a" font-size="10.8">source confidence,</text><text x="532.0" y="342" fill="#8fa89a" font-size="10.8">tokens</text>
