<rect x="1" y="1" width="998" height="618" rx="14" fill="url(#csl)"/>
<text x="36" y="42" fill="#e8f5ec" font-size="17" font-weight="bold">ColorTrace — capture, compare, explain</text>
<text x="36" y="66" fill="#8fa89a" font-size="12">local-first visual color debugger · WXT + Manifest V3 · Chromium &amp; Firefox</text>
<text x="964" y="42" text-anchor="end" fill="#33ff66" font-size="12">page → capture → diff → report</text>

